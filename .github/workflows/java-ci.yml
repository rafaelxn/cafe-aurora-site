name: Java CI
on:
  push:
    branches: [main, fix/full-stack-orders-security-2026]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and integration tests
        run: mvn -B test
