name: Java and JavaScript CI

on:
  push:
    branches: [main, fix/full-stack-orders-security-2026]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check JavaScript syntax
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify static GitHub Pages demo flows
        run: node --test tests/demo-api.test.cjs

      - name: Build and integration tests
        run: mvn -B clean verify
