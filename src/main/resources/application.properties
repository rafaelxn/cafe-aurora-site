spring.application.name=cafe-aurora

# Configurar DB_USER e DB_PASSWORD no ambiente local (nunca commitar senhas).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafe_aurora?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Apenas para desenvolvimento. Em produção, usar migrations e DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
